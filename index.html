<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Positions</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #0f0e0e;
            --bg-card: #1a1918;
            --bg-card-hover: #222120;
            --bg-surface: #2a2827;
            --accent: #d4a053;
            --accent-glow: #d4a05340;
            --accent-soft: #d4a05320;
            --rose: #c97b7b;
            --rose-soft: #c97b7b25;
            --green: #7bc985;
            --green-soft: #7bc98525;
            --red: #c97b7b;
            --text-primary: #e8e0d6;
            --text-secondary: #9a9089;
            --text-muted: #5a544e;
            --border: #2a2827;
            --border-light: #3a3837;
            --radius: 16px;
            --radius-sm: 10px;
            --radius-xs: 6px;
            --shadow: 0 8px 32px rgba(0,0,0,0.4);
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg-deep);
            color: var(--text-primary);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        /* Subtle texture overlay */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 0;
        }

        .app {
            max-width: 480px;
            margin: 0 auto;
            padding: 20px 16px 100px;
            position: relative;
            z-index: 1;
        }

        /* ===== HEADER ===== */
        .header {
            text-align: center;
            padding: 24px 0 20px;
            position: relative;
        }

        .header h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 32px;
            font-weight: 600;
            letter-spacing: 0.08em;
            color: var(--accent);
            text-transform: uppercase;
        }

        .sync-indicator {
            position: absolute;
            top: 28px;
            right: 0;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--green);
            transition: var(--transition);
            opacity: 0.7;
        }

        .sync-indicator.syncing {
            background: var(--accent);
            animation: pulse 1s ease infinite;
        }

        .sync-indicator.error {
            background: var(--red);
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.4; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.3); }
        }

        /* ===== PROGRESS ===== */
        .progress-section {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 16px;
        }

        .progress-bar-container {
            height: 28px;
            background: var(--bg-surface);
            border-radius: 14px;
            overflow: hidden;
            margin-bottom: 16px;
            position: relative;
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), #e8c47a);
            border-radius: 14px;
            transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .progress-bar-text {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.06em;
            color: var(--text-primary);
            text-shadow: 0 1px 3px rgba(0,0,0,0.4);
            z-index: 1;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-family: 'Cormorant Garamond', serif;
            font-size: 28px;
            font-weight: 700;
            color: var(--text-primary);
            line-height: 1;
        }

        .stat-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* ===== NAV ===== */
        .nav {
            display: flex;
            gap: 4px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 4px;
            margin-bottom: 16px;
        }

        .nav-btn {
            flex: 1;
            padding: 10px 8px;
            background: transparent;
            border: none;
            border-radius: var(--radius-xs);
            font-family: 'DM Sans', sans-serif;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-muted);
            cursor: pointer;
            transition: var(--transition);
            letter-spacing: 0.02em;
        }

        .nav-btn:hover { color: var(--text-secondary); }

        .nav-btn.active {
            background: var(--accent);
            color: var(--bg-deep);
            font-weight: 600;
        }

        /* ===== TABS ===== */
        .tab { display: none; }
        .tab.active { display: block; }

        /* ===== POSITION CARD ===== */
        .position-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            margin-bottom: 12px;
            animation: cardIn 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes cardIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .position-image-wrap {
            width: 100%;
            aspect-ratio: 4/3;
            background: var(--bg-surface);
            overflow: hidden;
            position: relative;
        }

        .position-image-wrap img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: var(--bg-surface);
        }

        .position-body {
            padding: 20px;
        }

        .position-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        .badge-beginner { background: #7bc98520; color: #7bc985; }
        .badge-intermediate { background: #d4a05325; color: #d4a053; }
        .badge-advanced { background: #c97b7b25; color: #c97b7b; }
        .badge-toy { background: #b07bc920; color: #b07bc9; }
        .badge-bondage { background: #c9997b20; color: #c9997b; }

        .position-name {
            font-family: 'Cormorant Garamond', serif;
            font-size: 26px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 8px;
            line-height: 1.2;
        }

        .position-desc {
            font-size: 14px;
            line-height: 1.6;
            color: var(--text-secondary);
        }

        .equipment-box {
            margin-top: 14px;
            padding: 12px;
            background: var(--bg-surface);
            border-radius: var(--radius-xs);
            border-left: 3px solid var(--accent);
        }

        .equipment-box-title {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--accent);
            margin-bottom: 6px;
        }

        .equipment-box li {
            font-size: 13px;
            color: var(--text-secondary);
            padding: 2px 0;
            list-style: none;
        }

        .equipment-box li::before {
            content: '→ ';
            color: var(--accent);
        }

        /* ===== EMPTY STATE ===== */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
        }

        .empty-icon {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.6;
        }

        .empty-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 22px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        .empty-sub {
            font-size: 13px;
            color: var(--text-muted);
        }

        /* ===== BUTTONS ===== */
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 14px 20px;
            border: none;
            border-radius: var(--radius-sm);
            font-family: 'DM Sans', sans-serif;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            letter-spacing: 0.02em;
        }

        .btn:active { transform: scale(0.97); }

        .btn-accent {
            background: var(--accent);
            color: var(--bg-deep);
        }

        .btn-accent:hover {
            background: #e0ad5e;
            box-shadow: 0 4px 20px var(--accent-glow);
        }

        .btn-green { background: var(--green-soft); color: var(--green); border: 1px solid #7bc98530; }
        .btn-green:hover { background: #7bc98535; }

        .btn-ghost {
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--border);
        }

        .btn-ghost:hover { border-color: var(--border-light); color: var(--text-primary); }

        .btn-danger { background: var(--rose-soft); color: var(--rose); border: 1px solid #c97b7b30; }
        .btn-danger:hover { background: #c97b7b35; }

        .btn-warn { background: #d4a05315; color: var(--accent); border: 1px solid #d4a05330; }
        .btn-warn:hover { background: #d4a05325; }

        .action-grid {
            display: grid;
            gap: 8px;
            margin-bottom: 8px;
        }

        .action-grid-3 { grid-template-columns: 1fr 1fr 1fr; }

        .btn-sm {
            padding: 10px 12px;
            font-size: 12px;
        }

        /* ===== RATING ===== */
        .rating-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 12px;
            animation: cardIn 0.3s ease;
        }

        .rating-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 20px;
            font-weight: 600;
            text-align: center;
            margin-bottom: 16px;
            color: var(--text-secondary);
        }

        .rating-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            margin-bottom: 14px;
        }

        .rating-btn {
            padding: 16px;
            background: var(--bg-surface);
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 28px;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .rating-btn span {
            font-size: 11px;
            font-family: 'DM Sans', sans-serif;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        .rating-btn:hover { border-color: var(--border-light); background: var(--bg-card-hover); }

        .rating-btn.selected {
            border-color: var(--accent);
            background: var(--accent-soft);
        }

        .rating-btn.selected span { color: var(--accent); }

        /* ===== EQUIPMENT TAB ===== */
        .equip-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 16px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            margin-bottom: 8px;
        }

        .equip-name {
            font-weight: 500;
            font-size: 14px;
        }

        .equip-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .equip-count {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .equip-got-btn {
            padding: 6px 14px;
            background: var(--green-soft);
            color: var(--green);
            border: 1px solid #7bc98530;
            border-radius: 20px;
            font-family: 'DM Sans', sans-serif;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }

        .equip-got-btn:hover { background: #7bc98535; }

        /* ===== STATS TAB ===== */
        .stats-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 12px;
        }

        .stats-card-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .stats-overview {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .stats-tile {
            padding: 14px;
            border-radius: var(--radius-sm);
            text-align: center;
        }

        .stats-tile-value {
            font-family: 'Cormorant Garamond', serif;
            font-size: 30px;
            font-weight: 700;
            line-height: 1;
        }

        .stats-tile-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-top: 4px;
        }

        .pos-list-item {
            padding: 12px;
            border-left: 3px solid var(--accent);
            background: var(--bg-surface);
            border-radius: 0 var(--radius-xs) var(--radius-xs) 0;
            margin-bottom: 8px;
        }

        .pos-list-name {
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 3px;
        }

        .pos-list-desc {
            font-size: 12px;
            color: var(--text-muted);
            line-height: 1.4;
        }

        .pos-list-tags {
            margin-top: 6px;
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
        }

        .pos-list-tags .badge { font-size: 9px; padding: 2px 8px; }

        /* ===== UTILITY BAR ===== */
        .utility-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }

        .utility-bar .btn { flex: 1; }

        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 12px 24px;
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 500;
            z-index: 100;
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: var(--shadow);
            pointer-events: none;
        }

        .toast.visible {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ===== HIDDEN ===== */
        .hidden { display: none !important; }

        /* ===== CONFIRM OVERLAY ===== */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 50;
            padding: 20px;
            animation: fadeIn 0.2s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .overlay-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            max-width: 340px;
            width: 100%;
            animation: cardIn 0.3s ease;
        }

        .overlay-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .overlay-text {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 16px;
            line-height: 1.5;
        }

        .overlay-actions {
            display: flex;
            gap: 8px;
        }

        .overlay-actions .btn { flex: 1; }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 480px) {
            .app { padding: 12px 12px 100px; }
            .header h1 { font-size: 26px; }
            .position-name { font-size: 22px; }
            .stats-grid { gap: 4px; }
            .stat-value { font-size: 24px; }
        }
    </style>
</head>
<body>
    <div class="app">
        <header class="header">
            <h1>Positions</h1>
            <div class="sync-indicator" id="syncIndicator" title="Sync status"></div>
        </header>

        <!-- Progress -->
        <div class="progress-section">
            <div class="progress-bar-container">
                <div class="progress-bar-fill" id="progressFill" style="width: 0%"></div>
                <div class="progress-bar-text" id="progressText">0%</div>
            </div>
            <div class="stats-grid">
                <div class="stat-item">
                    <div class="stat-value" id="completedCount">0</div>
                    <div class="stat-label">Done</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="favoritesCount">0</div>
                    <div class="stat-label">❤️ Fav</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="likedCount">0</div>
                    <div class="stat-label">👍 Liked</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="remainingCount">0</div>
                    <div class="stat-label">Left</div>
                </div>
            </div>
        </div>

        <!-- Nav -->
        <nav class="nav">
            <button class="nav-btn active" data-tab="positions">Explore</button>
            <button class="nav-btn" data-tab="equipment">Equipment</button>
            <button class="nav-btn" data-tab="stats">Stats</button>
        </nav>

        <!-- Utility bar -->
        <div class="utility-bar">
            <button class="btn btn-ghost btn-sm" onclick="undoLastAction()">↩ Undo</button>
            <button class="btn btn-ghost btn-sm" onclick="showResetConfirm()">Reset</button>
        </div>

        <!-- POSITIONS TAB -->
        <div class="tab active" id="tab-positions">
            <!-- Suggest view -->
            <div id="suggestView">
                <div class="position-card">
                    <div class="empty-state">
                        <div class="empty-icon">✦</div>
                        <div class="empty-title">Ready to explore?</div>
                        <div class="empty-sub">Tap below to get a suggestion</div>
                    </div>
                </div>
                <button class="btn btn-accent" onclick="suggestPosition()">Suggest a Position</button>
            </div>

            <!-- Position view -->
            <div id="positionView" class="hidden">
                <div class="position-card">
                    <div class="position-image-wrap" id="imageWrap" style="display:none;">
                        <img id="positionImage" alt="">
                    </div>
                    <div class="position-body">
                        <div class="position-meta" id="metaContainer"></div>
                        <h2 class="position-name" id="positionName"></h2>
                        <p class="position-desc" id="positionDesc"></p>
                        <div id="equipmentNeeded" class="hidden">
                            <div class="equipment-box">
                                <div class="equipment-box-title">Equipment Needed</div>
                                <ul id="equipmentList"></ul>
                            </div>
                        </div>
                    </div>
                </div>

                <button class="btn btn-green" onclick="showRating()" style="margin-bottom:8px">✓ Complete</button>

                <div id="ratingSection" class="hidden">
                    <div class="rating-card">
                        <div class="rating-title">How was it?</div>
                        <div class="rating-buttons">
                            <button class="rating-btn" data-rating="dislike" onclick="selectRating('dislike')">
                                👎<span>Nah</span>
                            </button>
                            <button class="rating-btn" data-rating="like" onclick="selectRating('like')">
                                👍<span>Good</span>
                            </button>
                            <button class="rating-btn" data-rating="favorite" onclick="selectRating('favorite')">
                                ❤️<span>Loved</span>
                            </button>
                        </div>
                        <button class="btn btn-accent" onclick="completePosition()">Save</button>
                    </div>
                </div>

                <div class="action-grid action-grid-3">
                    <button class="btn btn-warn btn-sm" onclick="dontHaveEquipment()">🚫 No toys</button>
                    <button class="btn btn-danger btn-sm" onclick="showRemoveConfirm()">✕ Remove</button>
                    <button class="btn btn-ghost btn-sm" onclick="skipPosition()">Skip →</button>
                </div>
            </div>
        </div>

        <!-- EQUIPMENT TAB -->
        <div class="tab" id="tab-equipment">
            <div id="equipmentListContainer"></div>
        </div>

        <!-- STATS TAB -->
        <div class="tab" id="tab-stats">
            <div class="stats-card">
                <div class="stats-card-title">Overview</div>
                <div class="stats-overview">
                    <div class="stats-tile" style="background:var(--green-soft)">
                        <div class="stats-tile-value" style="color:var(--green)" id="sLiked">0</div>
                        <div class="stats-tile-label" style="color:var(--green)">👍 Liked</div>
                    </div>
                    <div class="stats-tile" style="background:var(--rose-soft)">
                        <div class="stats-tile-value" style="color:var(--rose)" id="sDisliked">0</div>
                        <div class="stats-tile-label" style="color:var(--rose)">👎 Disliked</div>
                    </div>
                    <div class="stats-tile" style="background:#c97b7b15">
                        <div class="stats-tile-value" style="color:#e8a0a0" id="sFavorited">0</div>
                        <div class="stats-tile-label" style="color:#e8a0a0">❤️ Favorites</div>
                    </div>
                    <div class="stats-tile" style="background:var(--accent-soft)">
                        <div class="stats-tile-value" style="color:var(--accent)" id="sRemoved">0</div>
                        <div class="stats-tile-label" style="color:var(--accent)">✕ Removed</div>
                    </div>
                </div>
            </div>

            <div class="stats-card">
                <div class="stats-card-title" style="color:#e8a0a0">❤️ Favorites</div>
                <div id="favoritesList"></div>
            </div>

            <div class="stats-card">
                <div class="stats-card-title" style="color:var(--green)">👍 Liked</div>
                <div id="likedList"></div>
            </div>

            <div class="stats-card">
                <div class="stats-card-title" style="color:var(--rose)">👎 Disliked</div>
                <div id="dislikedList"></div>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <!-- Overlays rendered dynamically -->
    <div id="overlayContainer"></div>

    <script>
        // ==========================================
        // SUPABASE CONFIG
        // ==========================================
        const SUPABASE_URL = 'https://dgbbloirhopjkpnckrdp.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRnYmJsb2lyaG9wamtwbmNrcmRwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc3OTcwMzYsImV4cCI6MjA4MzM3MzAzNn0.iVWe7_wVqvQjCIG70Jr9qka_Gn1WeFlRxsIjIvd0Ayg';
        const USER_CODE = 'HiLeeImTalkingToYouThroughCode';

        // ==========================================
        // STATE
        // ==========================================
        let positions = [];
        let appState = {
            completed: [],
            liked: [],
            disliked: [],
            favorited: [],
            removed: [],
            missingEquipment: {},
            currentPositionId: null,
            selectedRating: null,
            history: []
        };

        let syncTimeout = null;
        let isSyncing = false;

        // ==========================================
        // SUPABASE SYNC (bulletproof)
        // ==========================================
        const supabase = {
            headers() {
                return {
                    'apikey': SUPABASE_KEY,
                    'Authorization': `Bearer ${SUPABASE_KEY}`,
                    'Content-Type': 'application/json'
                };
            },

            async fetch(stateData) {
                try {
                    const res = await window.fetch(
                        `${SUPABASE_URL}/rest/v1/position_data?code=eq.${USER_CODE}&select=data,updated_at`,
                        { method: 'GET', headers: this.headers() }
                    );
                    if (!res.ok) throw new Error(`GET ${res.status}`);
                    const rows = await res.json();
                    return rows.length > 0 ? rows[0] : null;
                } catch (e) {
                    console.error('Supabase fetch error:', e);
                    return null;
                }
            },

            async save(stateData) {
                try {
                    // Use PATCH (update) if row exists, POST (insert) if not
                    // First try PATCH
                    const patchRes = await window.fetch(
                        `${SUPABASE_URL}/rest/v1/position_data?code=eq.${USER_CODE}`,
                        {
                            method: 'PATCH',
                            headers: { ...this.headers(), 'Prefer': 'return=minimal' },
                            body: JSON.stringify({
                                data: stateData,
                                updated_at: new Date().toISOString()
                            })
                        }
                    );

                    // If PATCH returned 404 or updated 0 rows, INSERT instead
                    if (!patchRes.ok) {
                        const insertRes = await window.fetch(
                            `${SUPABASE_URL}/rest/v1/position_data`,
                            {
                                method: 'POST',
                                headers: { ...this.headers(), 'Prefer': 'return=minimal' },
                                body: JSON.stringify({
                                    code: USER_CODE,
                                    data: stateData,
                                    updated_at: new Date().toISOString()
                                })
                            }
                        );
                        if (!insertRes.ok) throw new Error(`INSERT ${insertRes.status}`);
                    }

                    return true;
                } catch (e) {
                    console.error('Supabase save error:', e);
                    return false;
                }
            }
        };

        function setSyncStatus(status) {
            const el = document.getElementById('syncIndicator');
            el.className = 'sync-indicator' + (status !== 'ok' ? ' ' + status : '');
        }

        // Debounced auto-sync: saves 600ms after last state change
        function scheduleSave() {
            // Always save to localStorage immediately
            localStorage.setItem('positionExplorerState', JSON.stringify(appState));

            // Debounce cloud sync
            if (syncTimeout) clearTimeout(syncTimeout);
            syncTimeout = setTimeout(async () => {
                if (isSyncing) return;
                isSyncing = true;
                setSyncStatus('syncing');

                const ok = await supabase.save(appState);
                setSyncStatus(ok ? 'ok' : 'error');
                if (ok) console.log('☁️ Synced');
                else console.warn('☁️ Sync failed');

                isSyncing = false;
            }, 600);
        }

        function saveState() {
            scheduleSave();
        }

        // ==========================================
        // INIT
        // ==========================================
        async function init() {
            try {
                // Load positions JSON
                const res = await fetch('sex_positions_comprehensive.json');
                const data = await res.json();
                positions = data.positions;
            } catch (e) {
                console.error('Failed to load positions JSON:', e);
                toast('Error loading positions data');
                return;
            }

            // Load local state
            const local = localStorage.getItem('positionExplorerState');
            if (local) {
                try {
                    const parsed = JSON.parse(local);
                    appState = { ...appState, ...parsed };
                    // Migration cleanup
                    delete appState.currentPosition;
                    delete appState.isPositionShown;
                } catch (e) {}
            }

            // Try to load from cloud (cloud takes precedence)
            setSyncStatus('syncing');
            const cloud = await supabase.fetch();
            if (cloud && cloud.data) {
                // Cloud data exists - use it, it's the source of truth
                const cloudState = cloud.data;
                // Merge: cloud wins for arrays/objects, keep local for anything cloud doesn't have
                appState = { ...appState, ...cloudState };
                localStorage.setItem('positionExplorerState', JSON.stringify(appState));
                console.log('☁️ Loaded from cloud');
                setSyncStatus('ok');
            } else if (local) {
                // No cloud data but have local - push local to cloud
                const ok = await supabase.save(appState);
                setSyncStatus(ok ? 'ok' : 'error');
                console.log('☁️ Pushed local to cloud');
            } else {
                setSyncStatus('ok');
            }

            // Restore UI
            updateStats();
            if (appState.currentPositionId) {
                const pos = positions.find(p => p.id === appState.currentPositionId);
                if (pos && !appState.completed.includes(pos.id) && !appState.removed.includes(pos.id)) {
                    displayPosition(pos);
                } else {
                    appState.currentPositionId = null;
                    appState.selectedRating = null;
                    saveState();
                }
            }
        }

        // ==========================================
        // NAV
        // ==========================================
        document.querySelectorAll('.nav-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                btn.classList.add('active');
                document.getElementById('tab-' + btn.dataset.tab).classList.add('active');

                if (btn.dataset.tab === 'equipment') updateEquipmentList();
                if (btn.dataset.tab === 'stats') updateStatsTab();
            });
        });

        // ==========================================
        // POSITION LOGIC
        // ==========================================
        function getAvailablePositions() {
            return positions.filter(pos => {
                if (appState.completed.includes(pos.id) || appState.removed.includes(pos.id)) return false;
                if (pos.toy || pos.bondage) {
                    const required = [...(pos.toys_used || []), ...(pos.restraints_used || [])];
                    for (const eq of required) {
                        if (appState.missingEquipment[eq]) return false;
                    }
                }
                return true;
            });
        }

        function suggestPosition() {
            const available = getAvailablePositions();
            if (available.length === 0) {
                toast('No more positions! Check equipment or reset.');
                return;
            }
            const pos = available[Math.floor(Math.random() * available.length)];

            appState.history.push({
                action: 'suggest',
                positionId: pos.id,
                previousPositionId: appState.currentPositionId
            });
            appState.currentPositionId = pos.id;
            appState.selectedRating = null;
            saveState();
            displayPosition(pos);
        }

        function displayPosition(pos) {
            document.getElementById('suggestView').classList.add('hidden');
            document.getElementById('positionView').classList.remove('hidden');
            document.getElementById('ratingSection').classList.add('hidden');

            document.getElementById('positionName').textContent = pos.name;
            document.getElementById('positionDesc').textContent = pos.description;

            // Image
            const imgWrap = document.getElementById('imageWrap');
            const img = document.getElementById('positionImage');
            if (pos.image_file) {
                img.src = pos.image_file;
                imgWrap.style.display = 'block';
                img.onerror = () => { imgWrap.style.display = 'none'; };
            } else {
                imgWrap.style.display = 'none';
            }

            // Meta badges
            const meta = document.getElementById('metaContainer');
            meta.innerHTML = `<span class="badge badge-${pos.difficulty}">${pos.difficulty}</span>`;
            if (pos.toy) meta.innerHTML += '<span class="badge badge-toy">Toy</span>';
            if (pos.bondage) meta.innerHTML += '<span class="badge badge-bondage">Bondage</span>';

            // Equipment
            const equipNeeded = [...(pos.toys_used || []), ...(pos.restraints_used || [])];
            const equipSection = document.getElementById('equipmentNeeded');
            if (equipNeeded.length > 0) {
                equipSection.classList.remove('hidden');
                document.getElementById('equipmentList').innerHTML = equipNeeded.map(e => `<li>${e}</li>`).join('');
            } else {
                equipSection.classList.add('hidden');
            }

            // Reset rating selection
            document.querySelectorAll('.rating-btn').forEach(b => b.classList.remove('selected'));
        }

        function showRating() {
            document.getElementById('ratingSection').classList.remove('hidden');
        }

        function selectRating(rating) {
            appState.selectedRating = rating;
            document.querySelectorAll('.rating-btn').forEach(b => {
                b.classList.toggle('selected', b.dataset.rating === rating);
            });
        }

        function completePosition() {
            if (!appState.selectedRating) {
                toast('Pick a rating first!');
                return;
            }
            const posId = appState.currentPositionId;

            // Clean up suggest from history, add complete
            const idx = appState.history.findLastIndex(h => h.action === 'suggest' && h.positionId === posId);
            if (idx !== -1) appState.history.splice(idx, 1);

            appState.history.push({ action: 'complete', positionId: posId, rating: appState.selectedRating });
            appState.completed.push(posId);

            if (appState.selectedRating === 'like') appState.liked.push(posId);
            else if (appState.selectedRating === 'dislike') appState.disliked.push(posId);
            else if (appState.selectedRating === 'favorite') appState.favorited.push(posId);

            const pos = positions.find(p => p.id === posId);
            const emoji = appState.selectedRating === 'favorite' ? '❤️' : appState.selectedRating === 'like' ? '👍' : '👎';
            toast(`${emoji} ${pos?.name || 'Position'} completed!`);

            appState.currentPositionId = null;
            appState.selectedRating = null;
            saveState();
            updateStats();
            resetView();
        }

        function dontHaveEquipment() {
            const pos = positions.find(p => p.id === appState.currentPositionId);
            if (!pos) return;
            const equipment = [...(pos.toys_used || []), ...(pos.restraints_used || [])];
            if (equipment.length === 0) {
                toast('This one doesn\'t need any equipment!');
                return;
            }

            const idx = appState.history.findLastIndex(h => h.action === 'suggest' && h.positionId === pos.id);
            if (idx !== -1) appState.history.splice(idx, 1);

            appState.history.push({ action: 'missingEquipment', positionId: pos.id, equipment });

            equipment.forEach(item => {
                appState.missingEquipment[item] = (appState.missingEquipment[item] || 0) + 1;
            });

            appState.currentPositionId = null;
            saveState();
            updateEquipmentList();
            resetView();
            toast('Equipment noted — finding another…');
            setTimeout(() => suggestPosition(), 400);
        }

        function showRemoveConfirm() {
            const pos = positions.find(p => p.id === appState.currentPositionId);
            showOverlay(
                'Remove position?',
                `"${pos?.name}" will be permanently removed from your pool.`,
                'Remove',
                'btn-danger',
                () => {
                    const posId = appState.currentPositionId;
                    const idx = appState.history.findLastIndex(h => h.action === 'suggest' && h.positionId === posId);
                    if (idx !== -1) appState.history.splice(idx, 1);
                    appState.history.push({ action: 'remove', positionId: posId });
                    appState.removed.push(posId);
                    appState.currentPositionId = null;
                    saveState();
                    updateStats();
                    resetView();
                    toast('Position removed');
                }
            );
        }

        function skipPosition() {
            const posId = appState.currentPositionId;
            const idx = appState.history.findLastIndex(h => h.action === 'suggest' && h.positionId === posId);
            if (idx !== -1) appState.history.splice(idx, 1);
            appState.currentPositionId = null;
            appState.selectedRating = null;
            saveState();
            resetView();
        }

        function resetView() {
            document.getElementById('suggestView').classList.remove('hidden');
            document.getElementById('positionView').classList.add('hidden');
        }

        // ==========================================
        // UNDO
        // ==========================================
        function undoLastAction() {
            if (appState.history.length === 0) {
                toast('Nothing to undo');
                return;
            }
            const last = appState.history.pop();

            if (last.action === 'suggest') {
                appState.currentPositionId = last.previousPositionId || null;
                appState.selectedRating = null;
                saveState();
                if (appState.currentPositionId) {
                    const pos = positions.find(p => p.id === appState.currentPositionId);
                    if (pos) displayPosition(pos);
                    else resetView();
                } else resetView();
            } else if (last.action === 'complete') {
                appState.completed = appState.completed.filter(id => id !== last.positionId);
                appState.liked = appState.liked.filter(id => id !== last.positionId);
                appState.disliked = appState.disliked.filter(id => id !== last.positionId);
                appState.favorited = appState.favorited.filter(id => id !== last.positionId);
                appState.currentPositionId = last.positionId;
                appState.selectedRating = null;
                saveState();
                updateStats();
                const pos = positions.find(p => p.id === last.positionId);
                if (pos) displayPosition(pos);
            } else if (last.action === 'remove') {
                appState.removed = appState.removed.filter(id => id !== last.positionId);
                appState.currentPositionId = last.positionId;
                appState.selectedRating = null;
                saveState();
                updateStats();
                const pos = positions.find(p => p.id === last.positionId);
                if (pos) displayPosition(pos);
            } else if (last.action === 'missingEquipment') {
                last.equipment.forEach(item => {
                    if (appState.missingEquipment[item]) {
                        appState.missingEquipment[item]--;
                        if (appState.missingEquipment[item] <= 0) delete appState.missingEquipment[item];
                    }
                });
                appState.currentPositionId = last.positionId;
                appState.selectedRating = null;
                saveState();
                updateEquipmentList();
                const pos = positions.find(p => p.id === last.positionId);
                if (pos) displayPosition(pos);
            }

            toast('Undone ↩');
        }

        // ==========================================
        // RESET
        // ==========================================
        function showResetConfirm() {
            showOverlay(
                'Reset everything?',
                'All your progress, ratings, and history will be permanently erased. This cannot be undone.',
                'Reset All',
                'btn-danger',
                () => {
                    appState = {
                        completed: [], liked: [], disliked: [], favorited: [],
                        removed: [], missingEquipment: {}, currentPositionId: null,
                        selectedRating: null, history: []
                    };
                    saveState();
                    updateStats();
                    updateEquipmentList();
                    resetView();
                    toast('All data reset');
                }
            );
        }

        // ==========================================
        // EQUIPMENT TAB
        // ==========================================
        function updateEquipmentList() {
            const container = document.getElementById('equipmentListContainer');
            const items = Object.keys(appState.missingEquipment);
            if (items.length === 0) {
                container.innerHTML = `
                    <div class="stats-card">
                        <div class="empty-state">
                            <div class="empty-icon">✓</div>
                            <div class="empty-title">All clear</div>
                            <div class="empty-sub">No missing equipment tracked</div>
                        </div>
                    </div>`;
                return;
            }
            container.innerHTML = items.map(item => `
                <div class="equip-item">
                    <span class="equip-name">${item}</span>
                    <div class="equip-right">
                        <span class="equip-count">${appState.missingEquipment[item]} pos.</span>
                        <button class="equip-got-btn" onclick="markOwned('${item.replace(/'/g, "\\'")}')">Got it</button>
                    </div>
                </div>
            `).join('');
        }

        function markOwned(item) {
            delete appState.missingEquipment[item];
            saveState();
            updateEquipmentList();
            toast(`"${item}" positions unlocked!`);
        }

        // ==========================================
        // STATS TAB
        // ==========================================
        function updateStatsTab() {
            document.getElementById('sLiked').textContent = appState.liked.length;
            document.getElementById('sDisliked').textContent = appState.disliked.length;
            document.getElementById('sFavorited').textContent = appState.favorited.length;
            document.getElementById('sRemoved').textContent = appState.removed.length;

            document.getElementById('favoritesList').innerHTML = renderPosList(appState.favorited, '#e8a0a0');
            document.getElementById('likedList').innerHTML = renderPosList(appState.liked, 'var(--green)');
            document.getElementById('dislikedList').innerHTML = renderPosList(appState.disliked, 'var(--rose)');
        }

        function renderPosList(ids, color) {
            if (ids.length === 0) return '<div class="empty-sub" style="text-align:center;padding:16px;">None yet</div>';
            return ids.map(id => {
                const pos = positions.find(p => p.id === id);
                if (!pos) return '';
                let badges = `<span class="badge badge-${pos.difficulty}">${pos.difficulty}</span>`;
                if (pos.toy) badges += '<span class="badge badge-toy">Toy</span>';
                if (pos.bondage) badges += '<span class="badge badge-bondage">Bondage</span>';
                return `
                    <div class="pos-list-item" style="border-left-color:${color}">
                        <div class="pos-list-name">${pos.name}</div>
                        <div class="pos-list-desc">${pos.description}</div>
                        <div class="pos-list-tags">${badges}</div>
                    </div>`;
            }).join('');
        }

        // ==========================================
        // UI HELPERS
        // ==========================================
        function updateStats() {
            const total = positions.length;
            const done = appState.completed.length;
            const pct = total > 0 ? Math.round((done / total) * 100) : 0;
            document.getElementById('progressFill').style.width = pct + '%';
            document.getElementById('progressText').textContent = pct + '%';
            document.getElementById('completedCount').textContent = done;
            document.getElementById('favoritesCount').textContent = appState.favorited.length;
            document.getElementById('likedCount').textContent = appState.liked.length;
            document.getElementById('remainingCount').textContent = total - done - appState.removed.length;
        }

        function toast(msg) {
            const el = document.getElementById('toast');
            el.textContent = msg;
            el.classList.add('visible');
            setTimeout(() => el.classList.remove('visible'), 2400);
        }

        function showOverlay(title, text, actionLabel, actionClass, onConfirm) {
            const container = document.getElementById('overlayContainer');
            container.innerHTML = `
                <div class="overlay" onclick="if(event.target===this)closeOverlay()">
                    <div class="overlay-card">
                        <div class="overlay-title">${title}</div>
                        <div class="overlay-text">${text}</div>
                        <div class="overlay-actions">
                            <button class="btn btn-ghost btn-sm" onclick="closeOverlay()">Cancel</button>
                            <button class="btn ${actionClass} btn-sm" id="overlayConfirm">${actionLabel}</button>
                        </div>
                    </div>
                </div>`;
            document.getElementById('overlayConfirm').onclick = () => {
                closeOverlay();
                onConfirm();
            };
        }

        function closeOverlay() {
            document.getElementById('overlayContainer').innerHTML = '';
        }

        // ==========================================
        // BOOT
        // ==========================================
        init();
    </script>
</body>
</html>
